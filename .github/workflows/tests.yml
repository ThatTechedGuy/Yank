# Runs scripts/test.sh on GitHub's Mac: the import check, the package tests, then the UI tests,
# which take over the runner's screen instead of yours. Free on a public repository.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: scripts/test.sh
      # The result bundle has each failed UI test's screenshots and log.
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/Logs/Test/*.xcresult
