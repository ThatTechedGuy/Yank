# The source of truth for how Yank is built. XcodeGen (`brew install xcodegen`) turns this file
# into Yank.xcodeproj, which is git-ignored: edit this file, never the generated project.
# Run `xcodegen` after editing it, or after adding or removing a Swift file.

name: Yank

options:
  bundleIdPrefix: com.thattechedguy
  deploymentTarget:
    macOS: "26.4"
  createIntermediateGroups: true

# Signing lives in Signing.xcconfig: ad hoc by default, your own certificate if you add one.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Warnings fail the build here and in Package.swift, so they never pile up.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple silicon only: macOS 26 is the last release that runs on Intel, and a universal
    # binary would double the app's size for those few Macs.
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # Keep get-task-allow out of Release builds. It lets any process running as the user
      # attach to Yank and read its memory, which holds whatever was copied, passwords included.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

packages:
  ClipCore:
    path: Packages/ClipCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  Yank:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ClipCore
        product: ClipCore # Rules, storage, services: no UI code.
      - package: ClipCore
        product: ClipSystem # Adapters that talk to macOS.
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thattechedguy.Yank
        # App code is main-actor unless it says otherwise: it is mostly UI, and the clipboard
        # APIs need the main thread. The package modules keep Swift's default (no actor).
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Yank
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only: no Dock icon, and Yank never takes focus from the app being copied from.
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Yank.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      # Debug builds are a separate app, "Yank Debug", with their own sandbox container,
      # permissions and login item, so a debug session or a test run never touches the history
      # of the Release copy in /Applications.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.thattechedguy.Yank.debug
          INFOPLIST_KEY_CFBundleDisplayName: Yank Debug
        Release:
          # Xcode drops the hardened runtime from an ad hoc signature; this keeps it.
          OTHER_CODE_SIGN_FLAGS: --options=runtime

  YankUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AppUITests]
    dependencies:
      - target: Yank
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Yank

schemes:
  Yank:
    build:
      targets:
        Yank: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YankUITests
        - package: ClipCore/ClipCoreTests
        - package: ClipCore/ClipSystemTests
